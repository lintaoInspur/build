name: Build Panther-X2 SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-pantherx2:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install GCC-10
        run: |
          sudo apt-get install -y gcc-10 g++-10
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          sudo update-alternatives --set gcc /usr/bin/gcc-10
          sudo update-alternatives --set g++ /usr/bin/g++-10
          gcc --version   # 现在应显示 10.x
          g++ --version
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget unzip cpio bc libncurses5-dev dialog

      - name: Setup QEMU for cross compilation
        run: |
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Compile Panther-X2 SDK (non-interactive)
        run: |
          chmod +x ./compile.sh
          gcc --version 
          g++ --version 
          export DEBIAN_FRONTEND=noninteractive
          # 关键修正：使用 UBOOT_MAKE_FLAGS 并通过 KCFLAGS 禁用 -Werror
          export UBOOT_MAKE_FLAGS='KCFLAGS="-Wno-error"'
          ./compile.sh build \
            BOARD=panther-x2 \
            BRANCH=edge \
            RELEASE=trixie \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no
          # 注意：移除了无效的 USE_PREBUILT_UBOOT=yes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pantherx2-image
          path: output/
