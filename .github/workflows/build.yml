name: Build Panther-X2 SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-pantherx2:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git wget unzip cpio bc libncurses5-dev dialog

      - name: Setup QEMU for cross compilation
        run: |
          sudo apt-get install -y qemu-user-static binfmt-support
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Compile Panther-X2 SDK (non-interactive)
        run: |
          chmod +x ./compile.sh
          export DEBIAN_FRONTEND=noninteractive
          ./compile.sh build \
            BOARD=panther-x2 \
            BRANCH=current \
            RELEASE=trixie \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            USE_PREBUILT_UBOOT=yes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pantherx2-image
          path: output/
