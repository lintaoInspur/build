name: Build Panther-X2 SDK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      BOARD: panther-x2
      RELEASE: trixie
      BUILD_DESKTOP: no
      BUILD_MINIMAL: yes
      KERNEL_CONFIGURE: no

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip cpio bc libncurses5-dev

      - name: Run compile.sh
        run: |
          chmod +x ./compile.sh
          ./compile.sh \
            BOARD=${{ env.BOARD }} \
            RELEASE=${{ env.RELEASE }} \
            BUILD_DESKTOP=${{ env.BUILD_DESKTOP }} \
            BUILD_MINIMAL=${{ env.BUILD_MINIMAL }} \
            KERNEL_CONFIGURE=${{ env.KERNEL_CONFIGURE }}\
            FORCE_BOARD=yes \
            FORCE_MINIMAL=yes

      - name: Archive build output
        uses: actions/upload-artifact@v4
        with:
          name: pantherx2-image
          path: output/
